<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Bruno Getten Triches profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#160b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="65" r="150" fill="#7c3aed" opacity=".08"/>
  <circle cx="118" cy="285" r="180" fill="#22d3ee" opacity=".055"/>
  <path d="M70 240 C270 175, 430 285, 620 205 S980 125, 1135 185" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".32"/>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="90" cy="78" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="55" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="238" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ec4899" opacity=".8">
    <rect x="1080" y="90" width="8" height="8"><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="1102" y="112" width="5" height="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="73" y="208" width="6" height="6"><animateTransform attributeName="transform" type="translate" values="0 0;12 -7;0 0" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <text x="600" y="112" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="1">BRUNO GETTEN TRICHES</text>
  <rect x="392" y="137" width="416" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="181" text-anchor="middle" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">FULL STACK &amp; MOBILE · PRODUCT ENGINEERING · TECHNICAL LEADERSHIP</text>
  <text x="600" y="220" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">React Native / Expo  •  React / Next.js  •  Node.js  •  PHP / Laravel</text>
  <text x="600" y="271" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">&gt; build · ship · observe · improve</text>
</svg>
