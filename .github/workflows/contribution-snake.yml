name: Contribution animation

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%2367e8f9,%2322d3ee,%237c3aed,%23ec4899
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%23161b22,%2331265f,%235b3db6,%237c3aed,%23ec4899

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          grep -q '<svg' dist/github-snake.svg
          grep -q '<svg' dist/github-snake-dark.svg

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
