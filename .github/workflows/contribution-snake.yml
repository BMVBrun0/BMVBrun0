name: Contribution landscape

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-landscape
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D contribution landscape
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate generated landscape
        shell: bash
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-night-rainbow.svg
          test -s profile-3d-contrib/profile-season-animate.svg
          grep -q '<svg' profile-3d-contrib/profile-night-rainbow.svg
          grep -q '<svg' profile-3d-contrib/profile-season-animate.svg

      - name: Publish landscape
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib

          if git diff --cached --quiet; then
            echo "Contribution landscape is already current."
            exit 0
          fi

          git commit -m "chore(profile): refresh contribution landscape [skip ci]"
          git push
