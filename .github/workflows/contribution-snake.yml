name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%23c4b5fd,%23a78bfa,%237c3aed,%2322d3ee
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%23161b22,%2331265f,%235b3db6,%237c3aed,%23ec4899

      - name: Commit refreshed animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution animation"
          git push
