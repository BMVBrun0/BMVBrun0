name: Profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "scripts/profile-dashboard.mjs"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate activity dashboard
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/profile-dashboard.mjs

      - name: Validate generated dashboard
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/dashboard/activity-dark.svg assets/dashboard/activity-light.svg; do
            test -s "$file"
            grep -q '<svg' "$file"
            grep -q 'PUBLIC DEVELOPMENT SIGNAL' "$file"
            grep -q 'Contribution field' "$file"
            if grep -qiE 'placeholder|mock data|something went wrong|error while' "$file"; then
              echo "Invalid generated output: $file"
              exit 1
            fi
          done

      - name: Publish dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard/activity-dark.svg assets/dashboard/activity-light.svg

          if git diff --cached --quiet; then
            echo "Dashboard is already current."
            exit 0
          fi

          git commit -m "chore(profile): refresh activity dashboard [skip ci]"
          git push
