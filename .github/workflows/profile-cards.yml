name: Profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "scripts/profile-dashboard.mjs"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate activity dashboard
        env:
          GH_TOKEN: ${{ secrets.PROFILE_METRICS_TOKEN || secrets.METRICS_TOKEN || github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/profile-dashboard.mjs

      - name: Validate generated dashboard
        shell: bash
        run: |
          set -euo pipefail

          for file in assets/dashboard/activity-dark.svg assets/dashboard/activity-light.svg; do
            echo "Validating $file"

            if [[ ! -s "$file" ]]; then
              echo "ERROR: dashboard file is missing or empty: $file"
              exit 1
            fi

            if ! grep -q '<svg' "$file"; then
              echo "ERROR: generated file is not an SVG: $file"
              exit 1
            fi

            # Stable markers emitted by scripts/profile-dashboard.mjs.
            for marker in \
              'GITHUB ACTIVITY' \
              'Engineering dashboard' \
              '12-month contribution pulse' \
              'Repository code mix' \
              'Contribution field' \
              'Weekly rhythm'; do
              if ! grep -q "$marker" "$file"; then
                echo "ERROR: expected dashboard marker '$marker' was not found in $file"
                exit 1
              fi
            done

            if grep -qiE 'placeholder|mock data|something went wrong|error while' "$file"; then
              echo "ERROR: invalid placeholder/error text found in generated output: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Publish dashboard
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the freshly generated files outside the working tree.
          # Another workflow or a user commit may update main while this job runs.
          tmp_dir="$(mktemp -d)"
          cp assets/dashboard/activity-dark.svg "$tmp_dir/activity-dark.svg"
          cp assets/dashboard/activity-light.svg "$tmp_dir/activity-light.svg"

          branch="${GITHUB_REF_NAME:-main}"

          # Retry from the latest remote head so a concurrent commit cannot make
          # this job fail with a non-fast-forward push.
          for attempt in 1 2 3; do
            echo "Publish attempt $attempt on branch $branch"

            git fetch origin "$branch"
            git reset --hard "origin/$branch"

            mkdir -p assets/dashboard
            cp "$tmp_dir/activity-dark.svg" assets/dashboard/activity-dark.svg
            cp "$tmp_dir/activity-light.svg" assets/dashboard/activity-light.svg

            git add assets/dashboard/activity-dark.svg assets/dashboard/activity-light.svg

            if git diff --cached --quiet; then
              echo "Dashboard is already current on the latest remote commit."
              exit 0
            fi

            git commit -m "chore(profile): refresh activity dashboard [skip ci]"

            if git push origin "HEAD:$branch"; then
              echo "Dashboard published successfully."
              exit 0
            fi

            echo "Remote changed during publish; retrying from latest $branch..."
            sleep $((attempt * 2))
          done

          echo "ERROR: could not publish dashboard after 3 attempts because the remote kept changing."
          exit 1
